<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>second-brain · map</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22cc; --border:#30363d; --fg:#e6edf3;
    --muted:#8b949e; --accent:#58a6ff; --edge:#3a4048; --edge-hi:#58a6ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    color:var(--fg);font:13px/1.45 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif}
  #canvas{position:fixed;inset:0;display:block;cursor:grab}
  #canvas.grabbing{cursor:grabbing}
  .panel{position:fixed;background:var(--panel);border:1px solid var(--border);
    border-radius:10px;backdrop-filter:blur(8px);box-shadow:0 6px 24px #0008}
  #top{top:12px;left:60px;right:12px;display:flex;flex-wrap:wrap;gap:8px;
    align-items:center;padding:8px 10px;z-index:15}
  #top .title{font-weight:600;letter-spacing:.2px;white-space:nowrap}
  #top .title b{color:var(--accent)}
  /* the clear button lives INSIDE the field, so the input keeps its full width */
  .searchwrap{position:relative;flex:1;min-width:160px;display:flex}
  #search{flex:1;min-width:80px;background:#0d1117;border:1px solid var(--border);
    color:var(--fg);border-radius:7px;padding:6px 26px 6px 10px;outline:none;
    font-family:inherit;font-size:13px}
  #search:focus{border-color:var(--accent)}
  #searchx{position:absolute;right:2px;top:0;bottom:0;width:24px;border:0;
    background:none;color:var(--muted);cursor:pointer;font-size:14px;line-height:1;
    display:none}
  .searchwrap.has #searchx{display:block}
  #searchx:hover{color:var(--fg)}
  #stats{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
  .live{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
  .dot{width:8px;height:8px;border-radius:50%;background:#3fb950;
    box-shadow:0 0 6px #3fb950;animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  /* ---- filter dropdowns (one per facet, multi-select) ---- */
  #facets{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .dd{position:relative}
  .dd>.ddb{display:flex;align-items:center;gap:6px;background:#0d1117;
    border:1px solid var(--border);color:var(--fg);border-radius:7px;
    padding:6px 9px;font:inherit;font-size:12.5px;cursor:pointer;white-space:nowrap}
  .dd>.ddb:hover{border-color:var(--accent)}
  .dd.on>.ddb{border-color:var(--accent)}
  .ddb .ddn{color:var(--muted);font-variant-numeric:tabular-nums}
  .dd.on .ddb .ddn{color:var(--accent)}
  .ddb .cv{font-size:9px;color:var(--muted)}
  .ddm{display:none;position:absolute;top:calc(100% + 5px);left:0;min-width:216px;
    max-width:290px;background:var(--panel);border:1px solid var(--border);
    border-radius:9px;backdrop-filter:blur(8px);box-shadow:0 8px 28px #000a;
    padding:7px;z-index:30}
  .dd.open .ddm{display:block}
  .ddhead{display:flex;align-items:center;gap:6px;padding:2px 4px 7px;
    border-bottom:1px solid var(--border);margin-bottom:5px}
  .ddhead .t{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
    color:var(--muted);flex:1}
  .ddhead button{background:#0d1117;border:1px solid var(--border);color:var(--muted);
    border-radius:6px;padding:2px 8px;font:inherit;font-size:11px;cursor:pointer}
  .ddhead button:hover{border-color:var(--accent);color:var(--fg)}
  .ddopts{max-height:min(52vh,340px);overflow:auto}
  .opt{display:flex;align-items:center;gap:7px;padding:3px 5px;border-radius:6px;
    cursor:pointer;user-select:none}
  .opt:hover{background:#ffffff10}
  .opt input{margin:0;accent-color:var(--accent)}
  .opt .sw{width:11px;height:11px;border-radius:3px;flex:none}
  .opt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opt .ct{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;
    padding-left:6px}
  .opt.wide{align-items:flex-start}
  .fnote{color:var(--muted);font-size:11px;line-height:1.35;padding:3px 5px}
  .fnote code{color:var(--fg);font-size:10.5px}
  #detail{top:64px;right:12px;width:300px;max-height:78vh;overflow:auto;padding:14px;
    display:none}
  #detail.show{display:block}
  #detail .x{float:right;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
  #detail h3{margin:0 8px 2px 0;font-size:15px}
  #detail .type{display:inline-block;font-size:11px;padding:1px 8px;border-radius:20px;
    color:#000;font-weight:600;margin-bottom:8px}
  #detail .kv{color:var(--muted);margin:2px 0}
  #detail .kv b{color:var(--fg);font-weight:500}
  #detail .body{margin:8px 0;padding:8px;background:#0d1117;border-radius:7px;
    white-space:pre-wrap;max-height:160px;overflow:auto;color:#c9d1d9}
  #detail h5{margin:12px 0 4px;font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;color:var(--muted)}
  .rel{padding:4px 6px;border-radius:6px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
  .rel:hover{background:#ffffff10}
  .rel .arrow{color:var(--accent);font-family:ui-monospace,monospace;white-space:nowrap}
  .rel .r{color:var(--muted);font-style:italic}
  #hint{bottom:12px;left:12px;color:var(--muted);padding:6px 10px;font-size:11px}
  #err{bottom:12px;right:12px;color:#f85149;padding:6px 10px;display:none}

  /* ---- hamburger menu: the section switcher (Map / Dashboard / Settings) ----
     A drawer, not a top bar: it keeps the sections out of the search bar's way
     and leaves room for a Settings entry pinned at the bottom. */
  #burger{position:fixed;top:12px;left:12px;width:36px;height:34px;z-index:40;
    display:flex;align-items:center;justify-content:center;font-size:16px;
    cursor:pointer;color:var(--fg);padding:0}
  #scrim{position:fixed;inset:0;background:#0008;z-index:45;display:none}
  body.nav-open #scrim{display:block}
  #side{top:0;left:0;bottom:0;width:218px;border-radius:0;border-left:0;
    border-top:0;border-bottom:0;z-index:50;display:flex;flex-direction:column;
    padding:12px 10px;transform:translateX(-110%);transition:transform .16s ease}
  body.nav-open #side{transform:none}
  #side .sidehead{font-weight:600;letter-spacing:.2px;padding:6px 8px 12px;
    display:flex;align-items:center;gap:8px}
  #side .sidehead b{color:var(--accent)}
  #side .sidehead .x{margin-left:auto;color:var(--muted);cursor:pointer;font-size:15px}
  #side .sidehead .x:hover{color:var(--fg)}
  #side nav{display:flex;flex-direction:column;gap:3px}
  #side .foot{margin-top:auto;padding-top:9px;border-top:1px solid var(--border);
    display:flex;flex-direction:column;gap:3px}
  #side button{display:flex;align-items:center;gap:9px;text-align:left;border:0;
    background:transparent;color:var(--fg);cursor:pointer;border-radius:8px;
    padding:8px 9px;font:inherit;font-size:13.5px}
  #side button:hover{background:#ffffff10}
  #side button.active{background:var(--accent);color:#0d1117;font-weight:600}
  #side .sub{color:var(--muted);font-size:11px;padding:2px 9px 6px}
  #side button.active .k{color:#0d1117cc}

  /* ---- section visibility ----
     Every id'd panel is named here, not just `.map-only`: an id selector (1,0,0)
     beats a class hide, so `#top{display:flex}` would keep the search bar on
     screen in the dashboard and settings sections. */
  body:not(.mode-map){overflow:auto}
  body:not(.mode-map) #canvas,body:not(.mode-map) .map-only,
  body:not(.mode-map) #top,body:not(.mode-map) #detail,
  body:not(.mode-map) #hint,body:not(.mode-map) #err{display:none}
  body:not(.mode-dash) #dash{display:none}
  body:not(.mode-settings) #settings{display:none}
  #dash{max-width:840px;margin:0 auto;padding:64px 16px 60px}
  #dnav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 14px;position:sticky;top:0;
    background:var(--bg);z-index:2}
  #dnav button{white-space:nowrap;border:1px solid var(--border);background:var(--panel);
    color:var(--muted);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer}
  #dnav button.active{background:var(--accent);color:#0d1117;border-color:var(--accent)}
  #dctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
  #dctl label{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center}
  #dctl input,#dctl select{background:#0d1117;color:var(--fg);border:1px solid var(--border);
    border-radius:7px;padding:5px 8px;font-size:13px}
  .minebtn{border:1px solid var(--border);background:var(--panel);color:var(--muted);
    border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
  .minebtn.active{background:var(--accent);color:#0d1117;border-color:var(--accent);font-weight:600}
  .dchip.deleg{color:#bc8cff;border-color:#bc8cff}
  .dchip.asgc{color:#58a6ff;border-color:#58a6ff}
  .dchip.blk{color:#f85149;border-color:#f85149}
  .dchip.blks{color:#f0883e;border-color:#f0883e}
  .dchip.rel{color:#39c5cf;border-color:#39c5cf}
  .dchip.edit{cursor:pointer}
  .dchip.edit:hover{border-color:var(--accent);color:var(--accent)}
  .duepick{background:#0d1117;color:var(--fg);border:1px solid var(--accent);
    border-radius:6px;padding:2px 6px;font-size:11.5px}
  .minebtn.asg{opacity:.9}
  .minebtn.rlm{opacity:.9;border-style:dashed}
  .minebtn.knd{opacity:.9;border-style:dotted}
  .dchip.knd{color:#d29922;border-color:#d29922}
  .dsep{color:var(--border);user-select:none}
  .ddetail{margin-top:9px;padding-top:9px;border-top:1px solid var(--border)}
  .dbody{white-space:pre-wrap;color:#c9d1d9;background:#0d1117;border:1px solid var(--border);
    border-radius:7px;padding:9px;font-size:12.5px;max-height:220px;overflow:auto;margin-bottom:8px}
  .drelh{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
  .drelrow{font-size:12.5px;color:var(--fg);padding:2px 0;font-family:ui-monospace,monospace}

  /* ---- token-free editing: composer, card actions, relation manager ---- */
  .dbtn{background:#21262d;color:var(--fg);border:1px solid var(--border);border-radius:7px;
    padding:5px 10px;font-size:12px;cursor:pointer;font-family:inherit}
  .dbtn:hover{border-color:var(--accent)}
  .dbtn.pri{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
  .dbtn.ok{border-color:#3fb950;color:#3fb950}
  .dbtn.dngr{border-color:#f85149;color:#f85149}
  .dbtn:disabled{opacity:.45;cursor:default}
  #dnewbar{margin:0 0 12px}
  .nt{background:var(--panel);border:1px solid var(--accent);border-radius:11px;
    padding:13px;margin-bottom:12px}
  .nt input[type=text],.nt textarea,.nt select,.nt input[type=date]{
    background:#0d1117;color:var(--fg);border:1px solid var(--border);border-radius:7px;
    padding:7px 9px;font-size:13px;font-family:inherit;width:100%}
  .nt textarea{min-height:56px;resize:vertical}
  .nt input:focus,.nt textarea:focus,.nt select:focus{outline:none;border-color:var(--accent)}
  .ntgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:8px;margin-top:8px}
  .ntl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    display:block;margin-bottom:3px}
  .ntfoot{display:flex;gap:8px;align-items:center;margin-top:10px}
  .ntfoot .sp{flex:1}
  .sugbox{margin-top:10px;padding-top:9px;border-top:1px dashed var(--border)}
  .sugh{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);
    margin-bottom:6px}
  .sugrow{display:flex;gap:7px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
  .sugrow select{width:auto;font-size:11.5px;padding:3px 6px}
  .sugt{font-size:12.5px;color:var(--fg);flex:1;min-width:120px}
  .sugt b{color:var(--accent);font-weight:600}
  .sugcue{font-size:10.5px;color:var(--muted);font-style:italic}
  .dact{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:9px 0}
  .dact select,.dact input{background:#0d1117;color:var(--fg);border:1px solid var(--border);
    border-radius:7px;padding:4px 7px;font-size:12px;font-family:inherit}
  .dact input{width:110px}
  .relx{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;
    padding:0 4px;line-height:1}
  .relx:hover{color:#f85149}
  .lkrow{display:flex;gap:7px;align-items:center;margin-top:7px;flex-wrap:wrap}
  .lkrow input{background:#0d1117;color:var(--fg);border:1px solid var(--border);
    border-radius:7px;padding:4px 7px;font-size:12px;font-family:inherit;width:170px}
  .lkrow select{background:#0d1117;color:var(--fg);border:1px solid var(--border);
    border-radius:7px;padding:4px 7px;font-size:11.5px;font-family:inherit}
  .lkres{max-height:132px;overflow:auto;margin-top:5px}
  .lkres button{display:block;width:100%;text-align:left;background:#0d1117;color:var(--fg);
    border:1px solid var(--border);border-radius:6px;padding:4px 7px;font-size:12px;
    margin-bottom:3px;cursor:pointer;font-family:inherit}
  .lkres button:hover{border-color:var(--accent)}
  .dnote{font-size:11.5px;color:var(--muted);margin-top:6px}
  .dnote.err{color:#f85149}
  #dmeta{color:var(--muted);font-size:12.5px;margin:0 0 12px}
  .dcard{background:var(--panel);border:1px solid var(--border);border-radius:11px;
    padding:11px 13px;margin-bottom:9px}
  .dcard .dt{font-weight:600;margin-bottom:6px;word-break:break-word}
  .dchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .dchip{background:#0d1117;color:var(--muted);border:1px solid var(--border);
    border-radius:6px;padding:2px 7px;font-size:11.5px;font-variant-numeric:tabular-nums}
  .dchip.due{color:var(--fg);font-weight:600}
  .dchip.over{color:#f85149;border-color:#f85149}
  .dchip.st-done,.dchip.st-closed,.dchip.st-merged,.dchip.st-answered{color:#3fb950}
  .dchip.st-blocked,.dchip.st-waiting{color:#f0883e}
  .dwait{color:var(--muted);font-size:12.5px;margin-top:6px}
  .dwait b{color:var(--fg);font-weight:500}
  .dempty{color:var(--muted);text-align:center;padding:44px 0}

  /* ---- settings page ---- */
  #settings{max-width:760px;margin:0 auto;padding:64px 16px 60px}
  #settings h2{margin:0 0 4px;font-size:19px}
  #settings .lead{color:var(--muted);margin:0 0 18px;font-size:12.5px}
  .scard{background:var(--panel);border:1px solid var(--border);border-radius:11px;
    padding:14px;margin-bottom:12px}
  .scard h3{margin:0 0 3px;font-size:14px}
  .scard .hint{color:var(--muted);font-size:12px;margin:0 0 11px;line-height:1.45}
  .scard .hint code{color:var(--fg)}
  .srow{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-end}
  .sfield{display:flex;flex-direction:column;gap:3px;min-width:150px;flex:1}
  .sfield.sm{flex:0 0 128px;min-width:128px}
  .sfield label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted)}
  .sfield input,.sfield select{background:#0d1117;color:var(--fg);
    border:1px solid var(--border);border-radius:7px;padding:7px 9px;font-size:13px;
    font-family:inherit;width:100%}
  .sfield input:focus,.sfield select:focus{outline:none;border-color:var(--accent)}
  .sfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}
  .skv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;
    margin-bottom:11px}
  .skv .k{color:var(--muted)}
  .skv .v{font-family:ui-monospace,monospace;word-break:break-all}
  .badge{display:inline-block;border:1px solid var(--border);border-radius:999px;
    padding:1px 8px;font-size:11px;color:var(--muted)}
  .badge.ok{color:#3fb950;border-color:#3fb950}
  .badge.bad{color:#f0883e;border-color:#f0883e}
  .warn{color:#f0883e;font-size:12px;margin-top:8px}
  .out{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:11.5px;
    background:#0d1117;border:1px solid var(--border);border-radius:7px;padding:9px;
    margin-top:10px;max-height:230px;overflow:auto;color:#c9d1d9;display:none}
  .out.show{display:block}
</style>
</head>
<body class="mode-map">
<canvas id="canvas"></canvas>

<button id="burger" class="panel" title="sections (M)">☰</button>
<div id="scrim"></div>

<aside id="side" class="panel">
  <div class="sidehead">🧠 second-<b>brain</b><span class="x" id="navclose">✕</span></div>
  <nav>
    <button data-mode="map">🗺 <span>Map</span></button>
    <button data-mode="dash">📋 <span>Dashboard</span></button>
  </nav>
  <div class="foot">
    <button data-mode="settings">⚙ <span>Settings</span></button>
  </div>
</aside>

<div id="top" class="panel map-only">
  <div class="searchwrap">
    <input id="search" placeholder="search nodes… (title, type, id)">
    <button id="searchx" title="clear search (Esc)">✕</button>
  </div>
  <!-- the three facet dropdowns are generated (FACET_DEFS) — they differ only by
       name, so writing them out three times invites the label and the filter to
       drift apart. Display is hand-written: its options are toggles, not a
       vocabulary read from the brain. -->
  <div id="facets">
    <div class="dd" id="ddView">
      <button class="ddb">Display <span class="ddn">default</span><span class="cv">▾</span></button>
      <div class="ddm">
        <div class="ddhead"><span class="t">Display</span></div>
        <label class="opt"><input type="checkbox" id="hideDone">
          <span class="nm">hide done / archived</span></label>
        <label class="opt" title="A node stays only while at least one thing still points at it. Hide every source and it goes too.">
          <input type="checkbox" id="cascade">
          <span class="nm">drop unsupported</span><span class="ct" id="cascadeCt"></span></label>
      </div>
    </div>
  </div>
  <span id="stats">—</span>
  <span class="live"><span class="dot"></span><span id="livetxt">live</span></span>
</div>

<div id="detail" class="panel map-only"></div>
<div id="hint" class="panel map-only">scroll = zoom · drag bg = pan · drag node = pin · click = inspect · dbl-click bg = reset</div>
<div id="err" class="panel map-only"></div>

<!-- Dashboard tab: the off-token query views (today / tomorrow / week / agenda / closed / range) -->
<div id="dash">
  <div id="dnav"></div>
  <div id="dctl"></div>
  <div id="dnewbar"></div>
  <p id="dmeta"></p>
  <div id="dlist"></div>
</div>

<!-- Settings: preferences that live in <home>/settings.json, plus store upkeep.
     Written server-side, not in the browser — a timezone set here has to hold for
     the CLI, the hooks and any cron reading the same brain. -->
<div id="settings">
  <h2>Settings</h2>
  <p class="lead">Saved to the brain's home directory, so every path into it —
    CLI, hooks, cron, this page — reads the same answer.</p>
  <div id="scards"></div>
</div>

<script>
const COLORS = {
  person:"#58a6ff", task:"#3fb950", subtask:"#56d364", requirement:"#d29922",
  decision:"#db61a2", note:"#8b949e", project:"#bc8cff", reminder:"#f0883e",
  "writing-sample":"#79c0ff", association:"#a5d6ff", meeting:"#e3b341",
  "jira-issue":"#f778ba", resource:"#39c5cf", skill:"#ff7b72"
};
// Types and realms are OPEN vocabulary — anyone can invent one, so the palette
// above is a set of nice defaults, not the list. Anything unnamed gets a stable
// colour derived from its own text: same word, same hue, every session.
function hueOf(s){
  let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))>>>0;
  return Math.imul(h,2654435761)>>>0 ? (Math.imul(h,2654435761)>>>0)%360 : 0;
}
const colorFor = t => COLORS[t] || (t ? `hsl(${hueOf(t)} 55% 62%)` : "#8b949e");
// Realms are few and always rendered as a set, so spacing them evenly around the
// wheel beats hashing — hashing put optibus and personal 12° apart, which reads as
// the same colour on an 11px swatch. Index-based means the set is always legible.
function realmPalette(keys){
  const step=360/Math.max(keys.length,1), map={};
  keys.forEach((k,i)=>{ map[k]=`hsl(${Math.round(i*step+20)} 60% 60%)`; });
  return k => map[k] || "#8b949e";
}
const DONE = new Set(["done","cancelled"]);

const cv = document.getElementById('canvas'), ctx = cv.getContext('2d');
let DPR = Math.max(1, window.devicePixelRatio||1);
let W=0,H=0;
function resize(){ W=innerWidth;H=innerHeight; cv.width=W*DPR;cv.height=H*DPR;
  cv.style.width=W+'px';cv.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize); resize();

// ---- state ----
let nodes=[], edges=[], byId=new Map();
let view={scale:1, tx:W/2, ty:H/2};
let typesOff=new Set(), realmsOff=new Set(), hideDone=false, query="";
let kindsOff=new Set();
let cascade=false, cascadeOff=new Set();   // see recomputeCascade()
let selected=null, hover=null, dragNode=null, panning=false, last={x:0,y:0};
let version=null, alpha=1, boot=null;

const S = p => ({x: p.x*view.scale+view.tx, y: p.y*view.scale+view.ty});   // world->screen
const Wld = (sx,sy) => ({x:(sx-view.tx)/view.scale, y:(sy-view.ty)/view.scale});

// what the chips / toggles hide directly, before any knock-on effect
function directHidden(n){
  if(typesOff.has(n.type)) return true;
  if(realmsOff.has(n.realm||"")) return true;
  if(kindsOff.has(n.kind||"")) return true;
  if(hideDone && DONE.has(n.status)) return true;
  return false;
}
function hidden(n){ return directHidden(n) || cascadeOff.has(n.id); }

// "drop unsupported": once you hide something, also drop whatever was only being
// held up BY it. A node survives while at least one edge still points at it from
// something visible; a node nothing points at is a root and only the chips can
// hide it.
//
//   A -> B -> C -> D,  E -> C
//   hide A       => B goes with it (A was its only support); C survives on E, so D does too
//   hide A and E => B, then C, then D — the whole chain unwinds
//
// Run to a fixpoint because order matters: C has to fall before D can.
// Cached in cascadeOff — hidden() is called per node per frame, this is not.
function recomputeCascade(){
  cascadeOff = new Set();
  if(cascade){
    const parents=new Map();          // dst -> [src...]
    for(const e of edges){
      if(e.src===e.dst) continue;     // a self-loop is not support
      if(!parents.has(e.dst)) parents.set(e.dst,[]);
      parents.get(e.dst).push(e.src);
    }
    const gone=id=>{ const n=byId.get(id); return !n || directHidden(n) || cascadeOff.has(id); };
    for(let pass=0; pass<nodes.length; pass++){
      let changed=false;
      for(const n of nodes){
        if(cascadeOff.has(n.id) || directHidden(n)) continue;
        const src=parents.get(n.id);
        if(!src || !src.length) continue;            // root: nothing to lose
        if(src.every(gone)){ cascadeOff.add(n.id); changed=true; }
      }
      if(!changed) break;
    }
  }
  const ct=document.getElementById('cascadeCt');
  if(ct) ct.textContent = cascadeOff.size ? "+"+cascadeOff.size : "";
}
function matches(n){
  if(!query) return true;
  const q=query.toLowerCase();
  return (n.title||'').toLowerCase().includes(q) || n.type.includes(q) ||
         n.id.toLowerCase().includes(q);
}

// ---- data load + live refresh ----
async function load(){
  try{
    const r = await fetch('/api/graph'); const d = await r.json();
    document.getElementById('err').style.display='none';
    // The server re-execs when its code changes. Its boot id changes with it, and
    // this page is then older than the API behind it — reload rather than sit
    // there quietly missing whatever the new version added.
    if(boot===null){ boot=d.meta.boot||""; }
    else if((d.meta.boot||"")!==boot){ location.reload(); return; }
    if(d.version===version){ return; }      // nothing changed
    version=d.version;
    mergeGraph(d);
    document.getElementById('stats').textContent =
      `${d.meta.nodes} nodes · ${d.meta.edges} edges`;
    buildChips(d.meta.by_type);
    buildRealms(d.meta.by_realm);
    buildKinds(d.meta.by_kind);
    recomputeCascade();          // edges may have changed under the filter
    alpha=Math.max(alpha,.6);                // reheat so new nodes settle
  }catch(e){
    const el=document.getElementById('err'); el.style.display='block';
    el.textContent='⚠ '+e.message;
  }
}
function mergeGraph(d){
  const prev=byId; const nb=new Map();
  nodes = d.nodes.map(n=>{
    const old=prev.get(n.id);
    if(old){ Object.assign(old,n); nb.set(n.id,old); return old; }
    const seed = { ...n, x:(Math.random()-.5)*300, y:(Math.random()-.5)*300, vx:0, vy:0, fixed:false };
    nb.set(n.id,seed); return seed;
  });
  byId=nb;
  edges = d.edges.filter(e=>byId.has(e.src)&&byId.has(e.dst));
  if(selected && !byId.has(selected)) { selected=null; renderDetail(); }
}

// ---- physics (simple force-directed) ----
function step(){
  if(alpha<0.02){ return; }
  const vis = nodes.filter(n=>!hidden(n));
  const REP=1600, SPRING=0.02, LEN=70, GRAV=0.015;
  for(let i=0;i<vis.length;i++){
    const a=vis[i];
    for(let j=i+1;j<vis.length;j++){
      const b=vis[j];
      let dx=a.x-b.x, dy=a.y-b.y, d2=dx*dx+dy*dy||0.01;
      const f=REP/d2; const d=Math.sqrt(d2);
      const fx=f*dx/d, fy=f*dy/d;
      a.vx+=fx;a.vy+=fy; b.vx-=fx;b.vy-=fy;
    }
    a.vx-=a.x*GRAV; a.vy-=a.y*GRAV;   // gravity toward centre
  }
  for(const e of edges){
    const a=byId.get(e.src), b=byId.get(e.dst);
    if(hidden(a)||hidden(b)) continue;
    let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.01;
    const f=SPRING*(d-LEN); const fx=f*dx/d, fy=f*dy/d;
    a.vx+=fx;a.vy+=fy; b.vx-=fx;b.vy-=fy;
  }
  for(const n of vis){
    if(n===dragNode||n.fixed){ n.vx=0;n.vy=0; continue; }
    n.x+=n.vx*alpha; n.y+=n.vy*alpha; n.vx*=0.82; n.vy*=0.82;
  }
  alpha*=0.985;
}

function radius(n){ return 4+Math.sqrt(n.degree||0)*2.2; }

// ---- selection helpers ----
function neighbors(id){
  const set=new Set();
  for(const e of edges){ if(e.src===id)set.add(e.dst); if(e.dst===id)set.add(e.src); }
  return set;
}
let selNeighbors=new Set();

// ---- render ----
function draw(){
  if(mode!=='map'){ requestAnimationFrame(draw); return; }  // pause physics off-tab
  step();
  ctx.clearRect(0,0,W,H);
  const focus = selected||hover;
  const focusN = focus? neighbors(focus): null;

  // edges
  ctx.lineWidth=1;
  for(const e of edges){
    const a=byId.get(e.src), b=byId.get(e.dst);
    if(hidden(a)||hidden(b)) continue;
    const inFocus = focus && (e.src===focus||e.dst===focus);
    const A=S(a),B=S(b);
    ctx.strokeStyle = inFocus? getCss('--edge-hi') : (focus? '#2a2f36':'#3a4048');
    ctx.globalAlpha = focus && !inFocus ? .25 : (inFocus?.9:.5);
    ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.stroke();
    if(inFocus){ drawArrow(A,B,radius(b)); }
  }
  ctx.globalAlpha=1;

  // nodes
  const showLabels = view.scale>0.75;
  for(const n of nodes){
    if(hidden(n)) continue;
    const p=S(n), r=radius(n)*Math.max(.6,Math.min(view.scale,2));
    const m=matches(n);
    const dim = (focus && focus!==n.id && !focusN.has(n.id)) || (query && !m);
    ctx.globalAlpha = dim? .2 : 1;
    ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);
    ctx.fillStyle=colorFor(n.type); ctx.fill();
    if(n.id===selected){ ctx.lineWidth=3;ctx.strokeStyle='#fff';ctx.stroke(); }
    else if(query && m){ ctx.lineWidth=2;ctx.strokeStyle='#fff';ctx.stroke(); }
    if(showLabels || n.id===selected || n.id===hover || (query&&m&&!dim)){
      ctx.globalAlpha = dim?.3:1;
      ctx.fillStyle=getCss('--fg'); ctx.font='11px ui-sans-serif';
      const label=(n.title||n.id).slice(0,28);
      ctx.fillText(label, p.x+r+3, p.y+3);
    }
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
function drawArrow(A,B,rB){
  const ang=Math.atan2(B.y-A.y,B.x-A.x);
  const x=B.x-Math.cos(ang)*(rB+2), y=B.y-Math.sin(ang)*(rB+2), s=6;
  ctx.fillStyle=getCss('--edge-hi');
  ctx.beginPath();
  ctx.moveTo(x,y);
  ctx.lineTo(x-Math.cos(ang-.4)*s, y-Math.sin(ang-.4)*s);
  ctx.lineTo(x-Math.cos(ang+.4)*s, y-Math.sin(ang+.4)*s);
  ctx.closePath();ctx.fill();
}
const _css={};
function getCss(v){ return _css[v] || (_css[v]=getComputedStyle(document.documentElement).getPropertyValue(v).trim()); }

// ---- picking ----
function nodeAt(sx,sy){
  for(let i=nodes.length-1;i>=0;i--){
    const n=nodes[i]; if(hidden(n)) continue;
    const p=S(n), r=radius(n)*Math.max(.6,Math.min(view.scale,2))+3;
    if((sx-p.x)**2+(sy-p.y)**2 <= r*r) return n;
  }
  return null;
}

// ---- interaction ----
cv.addEventListener('mousedown',e=>{
  const n=nodeAt(e.clientX,e.clientY);
  if(n){ dragNode=n; n.fixed=true; }
  else{ panning=true; cv.classList.add('grabbing'); }
  last={x:e.clientX,y:e.clientY};
});
addEventListener('mousemove',e=>{
  if(dragNode){ const w=Wld(e.clientX,e.clientY); dragNode.x=w.x;dragNode.y=w.y; alpha=Math.max(alpha,.3); }
  else if(panning){ view.tx+=e.clientX-last.x; view.ty+=e.clientY-last.y; last={x:e.clientX,y:e.clientY}; }
  else{ const n=nodeAt(e.clientX,e.clientY); const id=n?n.id:null;
        if(id!==hover){ hover=id; cv.style.cursor=n?'pointer':'grab'; } }
});
addEventListener('mouseup',e=>{
  if(dragNode){ // treat as click if it didn't move much
    if(Math.abs(e.clientX-last0.x)<4 && Math.abs(e.clientY-last0.y)<4){ select(dragNode.id); dragNode.fixed=false; }
    dragNode=null;
  }
  panning=false; cv.classList.remove('grabbing');
});
let last0={x:0,y:0};
cv.addEventListener('mousedown',e=>last0={x:e.clientX,y:e.clientY});
cv.addEventListener('click',e=>{ if(!nodeAt(e.clientX,e.clientY) && !moved(e)) { select(null); } });
function moved(e){ return Math.abs(e.clientX-last0.x)>4||Math.abs(e.clientY-last0.y)>4; }
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const f=e.deltaY<0?1.12:0.893;
  const w=Wld(e.clientX,e.clientY);
  view.scale=Math.max(.1,Math.min(6,view.scale*f));
  view.tx=e.clientX-w.x*view.scale; view.ty=e.clientY-w.y*view.scale;
},{passive:false});
cv.addEventListener('dblclick',()=>{ view={scale:1,tx:W/2,ty:H/2}; });

function select(id){ selected=id; selNeighbors=id?neighbors(id):new Set(); renderDetail(); }

// ---- details panel ----
function renderDetail(){
  const el=document.getElementById('detail');
  if(!selected){ el.className='panel'; el.innerHTML=''; return; }
  const n=byId.get(selected); if(!n){ el.className='panel'; return; }
  const out=[], inc=[];
  for(const e of edges){
    if(e.src===n.id){ const t=byId.get(e.dst); out.push(`<div class="rel" data-id="${e.dst}"><span class="arrow">──▸</span><span><span class="r">${e.rel}</span> ${esc(t.title||e.dst)}</span></div>`); }
    if(e.dst===n.id){ const s=byId.get(e.src); inc.push(`<div class="rel" data-id="${e.src}"><span class="arrow">◂──</span><span>${esc(s.title||e.src)} <span class="r">${e.rel}</span></span></div>`); }
  }
  const props=Object.entries(n.props||{}).filter(([k])=>!['path'].includes(k))
    .map(([k,v])=>`<div class="kv"><b>${esc(k)}</b>: ${esc(String(v)).slice(0,120)}</div>`).join('');
  el.className='panel show';
  el.innerHTML=`<span class="x" onclick="select(null)">✕</span>
    <span class="type" style="background:${colorFor(n.type)}">${n.type}</span>
    <h3>${esc(n.title||n.id)}</h3>
    <div class="kv"><b>id</b>: ${esc(n.id)}</div>
    ${n.realm?`<div class="kv"><b>realm</b>: ${esc(n.realm)}</div>`:''}
    ${(n.kind&&n.kind!=='(none)')?`<div class="kv"><b>kind</b>: ${esc(n.kind)}</div>`:''}
    ${n.status?`<div class="kv"><b>status</b>: ${esc(n.status)}</div>`:''}
    ${n.due?`<div class="kv"><b>due</b>: ${esc(n.due)}</div>`:''}
    <div class="kv"><b>connections</b>: ${out.length+inc.length}</div>
    ${props}
    ${n.body?`<div class="body">${esc(n.body).slice(0,600)}</div>`:''}
    ${inc.length?`<h5>← incoming (${inc.length})</h5>${inc.join('')}`:''}
    ${out.length?`<h5>outgoing → (${out.length})</h5>${out.join('')}`:''}`;
  el.querySelectorAll('.rel').forEach(r=>r.onclick=()=>{ focusNode(r.dataset.id); });
}
function focusNode(id){ const n=byId.get(id); if(!n)return;
  select(id); view.tx=W/2-n.x*view.scale; view.ty=H/2-n.y*view.scale; }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---- filters: one dropdown per facet, multi-select ----
// One implementation for all three facets: the counts come from /api/graph meta,
// which derives them from the brain, so a brand-new type, realm or kind shows up
// on the next poll with no code change.
//
// A dropdown rather than one long scrolling list: the three vocabularies grow
// independently (types are fixed-ish, realms few, kinds unbounded), and stacked
// in one panel the tail of the list was unreachable without scrolling past the
// other two. Each menu carries its own "all" / "none", which tick or clear every
// option in THAT scope only.
const FACET_DEFS=[['types','Node types'],['realms','Realms'],['kinds','Kinds']];
const FACET_OFF={types:typesOff, realms:realmsOff, kinds:kindsOff};
const FACET_COUNTS={types:null, realms:null, kinds:null};
const facetEl=name=>document.querySelector('.dd[data-facet="'+name+'"]');
document.getElementById('facets').insertAdjacentHTML('afterbegin',
  FACET_DEFS.map(([name,label])=>`<div class="dd" data-facet="${name}">
    <button class="ddb">${label} <span class="ddn">all</span><span class="cv">▾</span></button>
    <div class="ddm">
      <div class="ddhead"><span class="t">${label}</span>
        <button data-act="all">all</button><button data-act="none">none</button></div>
      <div class="ddopts"></div>
    </div></div>`).join(''));

function buildFacet(name, counts){
  FACET_COUNTS[name]=counts;
  const dd=facetEl(name), box=dd.querySelector('.ddopts'), off=FACET_OFF[name];
  // index.html is re-read from disk on every request but serve.py is not — an
  // older server process serves this newer page and simply omits a facet it does
  // not know about. Say so, rather than rendering an empty list that reads as a
  // broken filter. Absent (undefined) is the stale case; {} is genuinely empty.
  if(counts==null){
    box.innerHTML='<div class="fnote">not sent by this server &mdash; '+
                  'restart <code>viz/serve.py</code> to pick up new filters</div>';
    summarise(name,[]); return;
  }
  const keys=Object.keys(counts).sort();
  // a filter that was hiding something now gone stops counting as active
  off.forEach(k=>{ if(!(k in counts)) off.delete(k); });
  if(!keys.length){ box.innerHTML='<div class="fnote">none</div>'; summarise(name,keys); return; }
  const swatch = name==='types' ? colorFor : realmPalette(keys);
  box.innerHTML=keys.map(k=>`<label class="opt">
      <input type="checkbox" data-k="${esc(k)}"${off.has(k)?'':' checked'}>
      <span class="sw" style="background:${swatch(k)}"></span>
      <span class="nm">${esc(k)||'(none)'}</span>
      <span class="ct">${counts[k]}</span></label>`).join('');
  box.querySelectorAll('input').forEach(cb=>cb.onchange=()=>{
    const k=cb.dataset.k;
    if(cb.checked) off.delete(k); else off.add(k);
    summarise(name,keys); applyFilter();
  });
  summarise(name,keys);
}
// the button has to say what the closed menu is doing — "all", "none", or "4/9"
function summarise(name, keys){
  const dd=facetEl(name), off=FACET_OFF[name];
  const on=keys.filter(k=>!off.has(k)).length;
  dd.querySelector('.ddn').textContent =
    !keys.length ? '—' : off.size===0 ? 'all' : on===0 ? 'none' : on+'/'+keys.length;
  dd.classList.toggle('on', off.size>0);
}
function setFacetAll(name, on){
  const counts=FACET_COUNTS[name]; if(counts==null) return;
  const off=FACET_OFF[name];
  off.clear();
  if(!on) Object.keys(counts).forEach(k=>off.add(k));
  buildFacet(name, counts);            // re-render every checkbox from the set
  applyFilter();
}
function applyFilter(){ recomputeCascade(); alpha=Math.max(alpha,.3); }
function buildChips(byType){ buildFacet('types', byType); }
function buildRealms(byRealm){ buildFacet('realms', byRealm); }
function buildKinds(byKind){ buildFacet('kinds', byKind); }

function closeDropdowns(){
  document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open'));
}
document.querySelectorAll('.dd').forEach(dd=>{
  dd.querySelector('.ddb').onclick=e=>{
    e.stopPropagation();
    const was=dd.classList.contains('open');
    closeDropdowns();
    if(!was) dd.classList.add('open');
  };
  // ticking a box must not close the menu — you are usually setting several
  dd.querySelector('.ddm').onclick=e=>e.stopPropagation();
  dd.querySelectorAll('.ddhead button').forEach(b=>b.onclick=()=>
    setFacetAll(dd.dataset.facet, b.dataset.act==='all'));
});
document.addEventListener('click',closeDropdowns);

// ---- search, with a way out of it ----
const searchEl=document.getElementById('search');
const searchWrap=document.querySelector('.searchwrap');
function setQuery(v){
  query=(v||'').trim();
  searchWrap.classList.toggle('has', !!(searchEl.value||'').length);
}
function clearSearch(){ searchEl.value=''; setQuery(''); searchEl.focus(); }
searchEl.addEventListener('input',e=>setQuery(e.target.value));
searchEl.addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.stopPropagation(); clearSearch(); }});
document.getElementById('searchx').onclick=clearSearch;

// ---- display toggles (same dropdown pattern, but they are not a vocabulary) ----
function viewSummary(){
  const n=(hideDone?1:0)+(cascade?1:0), dd=document.getElementById('ddView');
  dd.querySelector('.ddn').textContent = n? n+' on' : 'default';
  dd.classList.toggle('on', n>0);
}
document.getElementById('hideDone').addEventListener('change',e=>{
  hideDone=e.target.checked; viewSummary(); applyFilter();});
document.getElementById('cascade').addEventListener('change',e=>{
  cascade=e.target.checked; viewSummary(); applyFilter();});

// ---- sections (Map / Dashboard / Settings), behind the hamburger ----
let mode='map';
const MODES=['map','dash','settings'];
function setMode(m){
  if(!MODES.includes(m)) m='map';
  mode=m;
  MODES.forEach(x=>document.body.classList.toggle('mode-'+x, x===m));
  document.querySelectorAll('#side button[data-mode]').forEach(b=>
    b.classList.toggle('active', b.dataset.mode===m));
  closeNav(); closeDropdowns();
  if(location.hash.slice(1)!==m) history.replaceState(null,'','#'+m);
  if(m==='map'){ alpha=Math.max(alpha,.5); }          // reheat physics on return
  else if(m==='dash'){ Dash.show(); }                  // (re)load current view
  else { Settings.show(); }
  if(m!=='map') scrollTo(0,0);
}
function closeNav(){ document.body.classList.remove('nav-open'); }
document.getElementById('burger').onclick=e=>{
  e.stopPropagation(); document.body.classList.toggle('nav-open'); };
document.getElementById('navclose').onclick=closeNav;
document.getElementById('scrim').onclick=closeNav;
document.querySelectorAll('#side button[data-mode]').forEach(b=>
  b.onclick=()=>setMode(b.dataset.mode));
addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  if(e.key==='Escape'){ closeNav(); closeDropdowns(); }
  else if((e.key==='m'||e.key==='M') && !typing && !e.metaKey && !e.ctrlKey){
    document.body.classList.toggle('nav-open');
  }
});
addEventListener('hashchange',()=>setMode(location.hash.slice(1)||'map'));

// ---- dashboard tab (scoped so nothing collides with the map globals) ----
const Dash = (function(){
  const VIEWS=["agenda","open","today","tomorrow","week","closed","range"];
  const st={ view:"agenda", from:"", to:"", status:"any", since_days:7, mine:false,
             assignees:[], realms:[], kinds:[] };
  let ASSIGNEES={};   // token -> count, for the assignee filter chips
  let REALMS={};      // realm -> {nodes, open_tasks}, from /api/realms
  let KINDS={};       // props.kind -> {nodes, open_tasks}, from /api/kinds
  let DEFAULT_REALM="";
  let META={rels:[],statuses:[],writable:false};  // from /api/meta — never hardcoded here
  const $=s=>document.querySelector(s);
  const mk=(t,c,txt)=>{const e=document.createElement(t); if(c)e.className=c;
    if(txt!=null)e.textContent=txt; return e;};
  const isoAdd=d=>{const x=new Date();x.setDate(x.getDate()+d);return x.toISOString().slice(0,10);};

  function tabs(){
    const nav=$("#dnav"); nav.innerHTML="";
    VIEWS.forEach(v=>{ const b=mk("button",v===st.view?"active":null,v);
      b.onclick=()=>{ st.view=v; tabs(); ctl(); load(); }; nav.appendChild(b); });
  }
  function ctl(){
    const c=$("#dctl"); c.innerHTML="";
    // always-present "mine / needs action" toggle
    const mine=mk("button","minebtn"+(st.mine?" active":""),"🙋 Mine · needs action");
    mine.onclick=()=>{ st.mine=!st.mine; ctl(); load(); };
    c.appendChild(mine);
    // assignee filter chips (multi-select)
    Object.keys(ASSIGNEES).sort().forEach(a=>{
      const on=st.assignees.includes(a);
      const b=mk("button","minebtn asg"+(on?" active":""), a+" ("+ASSIGNEES[a]+")");
      b.onclick=()=>{ st.assignees=on?st.assignees.filter(x=>x!==a):st.assignees.concat([a]); ctl(); load(); };
      c.appendChild(b);
    });
    // realm filter chips (multi-select). None selected = every realm, which is
    // why there is no "all" pseudo-chip to get out of sync with the real ones.
    // Realms with no open tasks are still offered — the count says so honestly.
    const rkeys=Object.keys(REALMS).sort();
    if(rkeys.length>1){
      c.appendChild(mk("span","dsep","·"));
      rkeys.forEach(r=>{
        const on=st.realms.includes(r);
        const b=mk("button","minebtn rlm"+(on?" active":""), r+" ("+(REALMS[r].open_tasks||0)+")");
        b.title=r+" — "+REALMS[r].nodes+" node"+(REALMS[r].nodes===1?"":"s")+
                " total, "+(REALMS[r].open_tasks||0)+" open task"+
                (REALMS[r].open_tasks===1?"":"s");
        b.onclick=()=>{ st.realms=on?st.realms.filter(x=>x!==r):st.realms.concat([r]); ctl(); load(); };
        c.appendChild(b);
      });
    }
    // kind chips, from props.kind. Only kinds that actually appear on open tasks
    // are offered — the dashboard lists tasks, so a kind with none is dead UI here.
    const kkeys=Object.keys(KINDS).filter(k=>(KINDS[k].open_tasks||0)>0).sort();
    if(kkeys.length>1){
      c.appendChild(mk("span","dsep","·"));
      kkeys.forEach(k=>{
        const on=st.kinds.includes(k);
        const b=mk("button","minebtn knd"+(on?" active":""), k+" ("+KINDS[k].open_tasks+")");
        b.title=k+" — "+KINDS[k].nodes+" node"+(KINDS[k].nodes===1?"":"s")+" total";
        b.onclick=()=>{ st.kinds=on?st.kinds.filter(x=>x!==k):st.kinds.concat([k]); ctl(); load(); };
        c.appendChild(b);
      });
    }
    if(st.view==="range"){
      if(!st.from) st.from=isoAdd(0);
      if(!st.to) st.to=isoAdd(14);
      c.appendChild(dateBox("from")); c.appendChild(dateBox("to"));
      const sel=mk("select"); ["any","open","done"].forEach(o=>{const op=mk("option",null,o);
        op.value=o; if(o===st.status)op.selected=true; sel.appendChild(op);});
      sel.onchange=e=>{ st.status=e.target.value; load(); };
      const l=mk("label"); l.appendChild(mk("span",null,"status")); l.appendChild(sel); c.appendChild(l);
    } else if(st.view==="closed"){
      const inp=mk("input"); inp.type="number"; inp.min=1; inp.value=st.since_days; inp.style.width="64px";
      inp.onchange=e=>{ st.since_days=+e.target.value||7; load(); };
      const l=mk("label"); l.appendChild(mk("span",null,"since (days)")); l.appendChild(inp); c.appendChild(l);
    }
  }
  function dateBox(key){
    const inp=mk("input"); inp.type="date"; inp.value=st[key];
    inp.onchange=e=>{ st[key]=e.target.value; load(); };
    const l=mk("label"); l.appendChild(mk("span",null,key)); l.appendChild(inp); return l;
  }
  function qs(){
    const p=new URLSearchParams();
    if(st.view==="range"){ p.set("from",st.from); p.set("to",st.to); p.set("status",st.status); }
    if(st.view==="closed") p.set("since_days",st.since_days);
    if(st.mine) p.set("mine","1");
    if(st.assignees.length) p.set("assignee", st.assignees.join(","));
    if(st.realms.length) p.set("realm", st.realms.join(","));
    if(st.kinds.length) p.set("kind", st.kinds.join(","));
    const s=p.toString(); return s?("?"+s):"";
  }
  async function load(){
    const list=$("#dlist"), meta=$("#dmeta");
    meta.textContent="loading…"; list.innerHTML="";
    try{
      const r=await fetch("/api/"+st.view+qs()); const d=await r.json();
      if(!d.ok){ meta.innerHTML='<span style="color:#f85149">'+(d.error||"error")+'</span>'; return; }
      meta.textContent=d.title+" — "+d.count+" item"+(d.count===1?"":"s");
      if(!d.results.length){ list.appendChild(mk("div","dempty","Nothing here. Clear head. ✨")); return; }
      const today=isoAdd(0);
      d.results.forEach(row=>list.appendChild(card(row,today)));
    }catch(e){ meta.innerHTML='<span style="color:#f85149">can\'t reach server ('+e+')</span>'; }
  }
  function card(row,today){
    const c=mk("div","dcard");
    const head=mk("div","dt","▸ "+(row.title||"(untitled)")); c.appendChild(head);
    const chips=mk("div","dchips");
    {
      const has=row.due_local && row.due_local!=="--";
      const over=has && row.due_local<today;
      const dc=mk("span","dchip due edit"+(over?" over":""), has?("⏱ "+row.due_local):"📅 not set");
      dc.title="click to set/change due date";
      dc.onclick=(ev)=>{ ev.stopPropagation(); pickDue(dc,row); };
      chips.appendChild(dc);
    }
    if(row.type) chips.appendChild(mk("span","dchip",row.type));
    if(row.status) chips.appendChild(mk("span","dchip st-"+row.status,row.status));
    if(row.assignee) chips.appendChild(mk("span","dchip asgc","👤 "+row.assignee));
    if(row.realm) chips.appendChild(mk("span","dchip",row.realm));
    if(row.kind && row.kind!=="(none)") chips.appendChild(mk("span","dchip knd",row.kind));
    if(row.delegated) chips.appendChild(mk("span","dchip deleg","➦ "+row.delegated));
    if(row.blocked_by && row.blocked_by.length) chips.appendChild(mk("span","dchip blk","🔒 blocked ×"+row.blocked_by.length));
    if(row.blocks && row.blocks.length) chips.appendChild(mk("span","dchip blks","⛓ blocks ×"+row.blocks.length));
    if(row.related && row.related.length) chips.appendChild(mk("span","dchip rel","🔗 "+row.related.length));
    c.appendChild(chips);
    if(row.waiting_on){ const w=mk("div","dwait"); w.innerHTML="waiting on: <b></b>";
      w.querySelector("b").textContent=row.waiting_on; c.appendChild(w); }
    const det=mk("div","ddetail"); det.style.display="none"; c.appendChild(det);
    let loaded=false;
    head.style.cursor="pointer";
    head.onclick=async()=>{
      const open=det.style.display==="none";
      det.style.display=open?"block":"none";
      head.textContent=(open?"▾ ":"▸ ")+(row.title||"(untitled)");
      if(open && !loaded){ loaded=true; det.textContent="loading…"; await expand(row.id,det); }
    };
    return c;
  }
  // ---- token-free writes -------------------------------------------------
  // Every mutation is one POST to the engine's api_* helpers: plain SQL, no
  // model in the loop. The UI is a full CRUD client, not an AI front-end.
  async function post(path,body){
    try{
      const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify(body)});
      return await r.json();
    }catch(e){ return {ok:false,error:String(e)}; }
  }
  function relSelect(cur){
    const s=mk("select");
    (META.rels||["relates-to"]).forEach(r=>{ const o=mk("option",null,r); o.value=r;
      if(r===cur)o.selected=true; s.appendChild(o); });
    return s;
  }

  // ---- new-task composer, with live link recognition ----
  function newBar(){
    const bar=$("#dnewbar"); bar.innerHTML="";
    if(!META.writable){
      bar.appendChild(mk("div","dnote","read-only server (--no-write) — editing disabled"));
      return;
    }
    const b=mk("button","dbtn pri","＋ New task");
    b.onclick=()=>composer(bar,b);
    bar.appendChild(b);
  }
  function composer(bar,btn){
    btn.style.display="none";
    const f=mk("div","nt"); bar.appendChild(f);
    const title=mk("input"); title.type="text";
    title.placeholder="what needs doing? mention a ticket, PR or person and it links itself";
    f.appendChild(lbl("title",title));
    const grid=mk("div","ntgrid");
    const due=mk("input"); due.type="date";
    const asg=mk("input"); asg.type="text"; asg.placeholder="me";
    asg.setAttribute("list","asglist");
    const pri=mk("select"); ["","P1","P2","P3","P4"].forEach(p=>{const o=mk("option",null,p||"—");
      o.value=p; pri.appendChild(o);});
    const typ=mk("select"); ["task","subtask"].forEach(t=>{const o=mk("option",null,t);
      o.value=t; typ.appendChild(o);});
    // realms come from the brain, defaulting to the one the engine writes with.
    // If the filter has narrowed to exactly one realm, create there — the obvious
    // intent when you are looking at a single domain.
    const rlm=mk("select");
    const rlmKeys=Object.keys(REALMS).sort();
    if(!rlmKeys.length && DEFAULT_REALM) rlmKeys.push(DEFAULT_REALM);
    const preferred=(st.realms.length===1?st.realms[0]:DEFAULT_REALM);
    rlmKeys.forEach(r=>{ const o=mk("option",null,r); o.value=r;
      if(r===preferred)o.selected=true; rlm.appendChild(o); });
    grid.appendChild(lbl("due",due)); grid.appendChild(lbl("assignee",asg));
    grid.appendChild(lbl("priority",pri)); grid.appendChild(lbl("type",typ));
    grid.appendChild(lbl("realm",rlm));
    f.appendChild(grid);
    const body=mk("textarea"); body.placeholder="notes (optional)";
    const bw=lbl("details",body); bw.style.marginTop="8px"; f.appendChild(bw);
    // assignee autocomplete from the tokens already in the graph
    if(!$("#asglist")){
      const dl=mk("datalist"); dl.id="asglist";
      Object.keys(ASSIGNEES).forEach(a=>{const o=mk("option"); o.value=a; dl.appendChild(o);});
      f.appendChild(dl);
    }
    const sug=mk("div","sugbox"); sug.style.display="none"; f.appendChild(sug);
    let picks=[];                        // [{id,rel,title,type,on}]
    let t=null;
    title.oninput=()=>{ clearTimeout(t); t=setTimeout(()=>recognise(title.value,sug,picks),260); };
    const foot=mk("div","ntfoot");
    const save=mk("button","dbtn pri","Create task");
    const cancel=mk("button","dbtn","Cancel");
    const note=mk("span","dnote");
    foot.appendChild(save); foot.appendChild(cancel);
    foot.appendChild(mk("span","sp")); foot.appendChild(note);
    f.appendChild(foot);
    cancel.onclick=()=>{ f.remove(); btn.style.display=""; };
    save.onclick=async()=>{
      if(!title.value.trim()){ note.className="dnote err"; note.textContent="title required"; return; }
      save.disabled=true; note.className="dnote"; note.textContent="saving…";
      const links=picks.filter(p=>p.on).map(p=>({id:p.id,rel:p.rel}));
      const d=await post("/api/add-task",{ title:title.value.trim(), body:body.value.trim(),
        due:due.value?(due.value+"T12:00:00"):"", assignee:asg.value.trim(),
        priority:pri.value, type:typ.value, realm:rlm.value, links });
      if(!d.ok){ save.disabled=false; note.className="dnote err";
        note.textContent=d.error||"failed"; return; }
      f.remove(); btn.style.display="";
      await refreshFacets(); load();
    };
    title.focus();
  }
  function lbl(text,el){
    const w=mk("div"); w.appendChild(mk("span","ntl",text)); w.appendChild(el); return w;
  }
  // the recognition system: ask the engine what this text mentions, and how
  async function recognise(text,box,picks){
    if(text.trim().length<3){ box.style.display="none"; box.innerHTML=""; picks.length=0; return; }
    let d;
    try{
      const r=await fetch("/api/suggest-links?text="+encodeURIComponent(text));
      d=await r.json();
    }catch(e){ return; }
    if(!d.ok||!d.suggestions.length){ box.style.display="none"; box.innerHTML=""; picks.length=0; return; }
    // keep any relation the user already overrode / unchecked
    const prev={}; picks.forEach(p=>prev[p.id]={rel:p.rel,on:p.on,touched:p.touched});
    picks.length=0;
    box.innerHTML=""; box.style.display="block";
    box.appendChild(mk("div","sugh","recognised "+d.suggestions.length+
      " connection"+(d.suggestions.length===1?"":"s")+" — edit or uncheck"));
    d.suggestions.forEach(s=>{
      const old=prev[s.id]||{};
      const p={id:s.id,rel:old.touched?old.rel:s.rel,title:s.title,type:s.type,
               on:old.on!==undefined?old.on:true,touched:old.touched||false};
      picks.push(p);
      const row=mk("div","sugrow");
      const cb=mk("input"); cb.type="checkbox"; cb.checked=p.on;
      cb.onchange=()=>{ p.on=cb.checked; };
      const sel=relSelect(p.rel);
      sel.onchange=()=>{ p.rel=sel.value; p.touched=true; };
      const t=mk("div","sugt"); t.innerHTML="<b></b> <span></span>";
      t.querySelector("b").textContent=s.title.slice(0,52);
      t.querySelector("span").textContent="("+s.type+")";
      row.appendChild(cb); row.appendChild(sel); row.appendChild(t);
      if(s.cue) row.appendChild(mk("span","sugcue",'matched "'+s.cue+'"'));
      box.appendChild(row);
    });
  }
  // both facet vocabularies are re-read after a write, so a task created in a
  // brand-new realm makes that realm filterable immediately
  async function refreshFacets(){
    try{ const r=await fetch("/api/assignees"); const d=await r.json();
      if(d.ok) ASSIGNEES=d.assignees||{}; }catch(e){}
    try{ const r=await fetch("/api/realms"); const d=await r.json();
      if(d.ok){ REALMS=d.realms||{}; DEFAULT_REALM=d.default||DEFAULT_REALM;
        st.realms=st.realms.filter(x=>x in REALMS); } }catch(e){}
    try{ const r=await fetch("/api/kinds"); const d=await r.json();
      if(d.ok){ KINDS=d.kinds||{}; st.kinds=st.kinds.filter(x=>x in KINDS); } }catch(e){}
    ctl();
  }

  function pickDue(chip,row){
    const inp=mk("input"); inp.type="date"; inp.className="duepick";
    if(row.due_local && row.due_local!=="--") inp.value=row.due_local;
    chip.replaceWith(inp); inp.focus(); if(inp.showPicker){ try{inp.showPicker()}catch(e){} }
    let done=false;
    const wasDue=(row.due_local && row.due_local!=="--")?row.due_local:"";
    const commit=async()=>{ if(done)return; done=true;
      if((inp.value||"")===wasDue){ load(); return; }   // unchanged -> never write
      const v=inp.value, due=v?(v+"T12:00:00"):"";
      try{ await fetch("/api/set-due",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id:row.id,due})}); }catch(e){}
      load();
    };
    inp.onchange=commit;
    inp.onblur=()=>{ if(!done) load(); };
  }
  async function expand(id,det){
    try{
      const r=await fetch("/api/node?id="+encodeURIComponent(id)); const d=await r.json();
      if(!d.ok){ det.textContent=d.error||"error"; return; }
      det.innerHTML="";
      const redraw=()=>expand(id,det);
      if(d.body){ const b=mk("div","dbody",d.body); det.appendChild(b); }
      if(META.writable) det.appendChild(actions(d,redraw,det));
      det.appendChild(mk("div","drelh", d.edges && d.edges.length
        ? "Related ("+d.edges.length+")" : "No links"));
      if(d.edges && d.edges.length){
        const rel=mk("div","drel");
        d.edges.forEach(e=>{
          const line=mk("div","drelrow");
          const txt=mk("span",null,(e.dir==="out"?"→ ":"← ")+e.rel+": "+e.title+"  ("+e.type+")");
          line.appendChild(txt);
          if(META.writable){
            const x=mk("button","relx","×");
            x.title="remove this link";
            x.onclick=async()=>{
              x.disabled=true;
              // edges render from this node's perspective; unlink needs the real direction
              const src=e.dir==="out"?d.id:e.id, dst=e.dir==="out"?e.id:d.id;
              const res=await post("/api/unlink",{src,dst,rel:e.rel});
              if(res.ok){ redraw(); load(); } else { x.disabled=false; x.title=res.error||"failed"; }
            };
            line.appendChild(x);
          }
          rel.appendChild(line);
        });
        det.appendChild(rel);
      }
      if(META.writable) det.appendChild(linkAdder(d,redraw));
    }catch(e){ det.textContent="can't load ("+e+")"; }
  }
  // complete / status / assignee / rename — all without the model
  function actions(d,redraw,det){
    const bar=mk("div","dact");
    const note=mk("span","dnote");
    const done=(d.status||"")==="done"||(d.status||"")==="cancelled";
    if(!done){
      const ok=mk("button","dbtn ok","✓ Complete");
      ok.onclick=async()=>{ ok.disabled=true;
        const r=await post("/api/complete",{id:d.id});
        if(r.ok){ load(); redraw(); } else { ok.disabled=false; note.className="dnote err";
          note.textContent=r.error||"failed"; } };
      bar.appendChild(ok);
    }
    const st=mk("select");
    (META.statuses||[]).forEach(s=>{ const o=mk("option",null,s); o.value=s;
      if(s===(d.status||""))o.selected=true; st.appendChild(o); });
    if(!(META.statuses||[]).includes(d.status||"")){
      const o=mk("option",null,d.status||"—"); o.value=d.status||""; o.selected=true;
      st.insertBefore(o,st.firstChild);
    }
    const stWas=d.status||"";
    st.onchange=async()=>{
      if(st.value===stWas) return;
      const r=await post("/api/set-status",{id:d.id,status:st.value});
      if(r.ok){ load(); redraw(); } else { note.className="dnote err"; note.textContent=r.error; }
    };
    bar.appendChild(st);
    const asg=mk("input"); asg.type="text";
    // Guard: only write when the value ACTUALLY differs from what we rendered.
    // A change handler on a pre-filled input otherwise fires on any focus+blur
    // (autofill, a stray click, a re-render) and would silently reassign a task
    // the user never touched.
    const asgWas=(d.props&&d.props.assignee)||"";
    asg.value=asgWas;
    asg.placeholder="assignee"; asg.setAttribute("list","asglist");
    asg.onchange=async()=>{
      if(asg.value.trim()===asgWas.trim()) return;
      const r=await post("/api/set-assignee",{id:d.id,assignee:asg.value.trim()});
      if(r.ok){ refreshFacets(); load(); } else { note.className="dnote err";
        note.textContent=r.error; }
    };
    bar.appendChild(asg);
    const ed=mk("button","dbtn","✎ Edit");
    ed.onclick=()=>editor(d,redraw,det);
    bar.appendChild(ed);
    bar.appendChild(note);
    return bar;
  }
  function editor(d,redraw,det){
    const f=mk("div","nt");
    const title=mk("input"); title.type="text"; title.value=d.title||"";
    f.appendChild(lbl("title",title));
    const body=mk("textarea"); body.value=d.body||"";
    const bw=lbl("details",body); bw.style.marginTop="8px"; f.appendChild(bw);
    const foot=mk("div","ntfoot");
    const save=mk("button","dbtn pri","Save");
    const cancel=mk("button","dbtn","Cancel");
    const note=mk("span","dnote");
    foot.appendChild(save); foot.appendChild(cancel);
    foot.appendChild(mk("span","sp")); foot.appendChild(note);
    f.appendChild(foot);
    cancel.onclick=redraw;
    save.onclick=async()=>{
      save.disabled=true;
      const r=await post("/api/update-node",{id:d.id,title:title.value,body:body.value});
      if(r.ok){ load(); redraw(); }
      else { save.disabled=false; note.className="dnote err"; note.textContent=r.error||"failed"; }
    };
    // swap the action bar for the editor, in this card only
    const bar=det.querySelector(".dact");
    if(bar) bar.replaceWith(f); else det.appendChild(f);
    title.focus();
    return f;
  }
  // build a new relation by searching for the other end
  function linkAdder(d,redraw){
    const wrap=mk("div");
    const row=mk("div","lkrow");
    const q=mk("input"); q.type="text"; q.placeholder="link to… (search nodes)";
    const sel=relSelect("relates-to");
    row.appendChild(q); row.appendChild(sel);
    wrap.appendChild(row);
    const res=mk("div","lkres"); wrap.appendChild(res);
    const note=mk("div","dnote"); wrap.appendChild(note);
    let t=null;
    q.oninput=()=>{ clearTimeout(t); t=setTimeout(async()=>{
      res.innerHTML="";
      if(q.value.trim().length<2) return;
      try{
        const r=await fetch("/api/search?q="+encodeURIComponent(q.value.trim()));
        const s=await r.json();
        (s.results||[]).filter(x=>x.id!==d.id).forEach(x=>{
          const b=mk("button",null,x.title.slice(0,58)+"  ("+x.type+")");
          b.onclick=async()=>{
            b.disabled=true;
            const out=await post("/api/link",{src:d.id,dst:x.id,rel:sel.value});
            if(out.ok){ redraw(); load(); }
            else { b.disabled=false; note.className="dnote err"; note.textContent=out.error; }
          };
          res.appendChild(b);
        });
        if(!res.children.length) note.textContent="no matches";
      }catch(e){}
    },260); };
    return wrap;
  }
  let built=false, timer=null, REFRESH=120000;
  function arm(){
    clearInterval(timer);
    timer=setInterval(()=>{ if(mode==='dash') load(); }, REFRESH);
  }
  // the refresh cadence is a setting (Settings › interface), not a constant
  function setRefresh(ms){ REFRESH=Math.max(5000, ms||REFRESH); if(timer) arm(); }
  async function show(){
    if(!built){
      try{ const r=await fetch("/api/assignees"); const d=await r.json(); if(d.ok) ASSIGNEES=d.assignees||{}; }catch(e){}
      try{ const r=await fetch("/api/realms"); const d=await r.json();
        if(d.ok){ REALMS=d.realms||{}; DEFAULT_REALM=d.default||""; } }catch(e){}
      try{ const r=await fetch("/api/kinds"); const d=await r.json();
        if(d.ok) KINDS=d.kinds||{}; }catch(e){}
      try{ const r=await fetch("/api/meta"); const m=await r.json(); if(m.ok) META=m; }catch(e){}
      tabs(); ctl(); newBar(); built=true;
    }
    load();
    arm();
  }
  return { show, setRefresh };
})();

// ---- settings tab (preferences, store health, upkeep) ----
// Everything here is server-side state: POST /api/settings writes
// <home>/settings.json, which the CLI, the hooks and any cron read too. Nothing
// is kept in localStorage — a preference only one browser knows is not a setting.
const Settings = (function(){
  const $=s=>document.querySelector(s);
  let PREFS=null, STATUS=null, ZONES=[], REALMS={}, prefsReq=null;

  // the map/dashboard need the intervals before anyone opens this page
  function prefs(){
    if(!prefsReq) prefsReq=fetch('/api/settings').then(r=>r.json())
      .then(d=>{ if(d.ok){ PREFS=d; } return (d.ok&&d.effective)||{}; })
      .catch(()=>({}));
    return prefsReq;
  }

  async function show(){
    const box=$('#scards');
    box.innerHTML='<p class="lead">loading…</p>';
    const [s,st] = await Promise.all([
      fetch('/api/settings').then(r=>r.json()).catch(e=>({ok:false,error:String(e)})),
      fetch('/api/status').then(r=>r.json()).catch(e=>({ok:false,error:String(e)})),
    ]);
    if(!s.ok){
      box.innerHTML='<div class="scard"><h3>Settings unavailable</h3>'+
        '<p class="hint">'+esc(s.error||'this server does not serve /api/settings — '+
        'restart viz/serve.py')+'</p></div>';
      return;
    }
    PREFS=s; STATUS=st.ok?st:null;
    if(!ZONES.length){
      try{ const z=await fetch('/api/timezones').then(r=>r.json());
        if(z.ok) ZONES=z.zones||[]; }catch(e){}
    }
    try{ const r=await fetch('/api/realms'); const d=await r.json();
      if(d.ok) REALMS=d.realms||{}; }catch(e){}
    render();
  }

  function render(){
    const eff=PREFS.effective||{}, env=PREFS.env||{}, ro=!PREFS.writable;
    const box=$('#scards');
    box.innerHTML='';
    if(ro) box.appendChild(note('Read-only server',
      'Started with <code>--no-write</code>: you can read every setting here, but '+
      'saving, flushing and pruning are refused.'));
    box.appendChild(tzCard(eff,env,ro));
    box.appendChild(prefCard(eff,env,ro));
    box.appendChild(dbCard(ro));
    box.appendChild(maintCard(ro));
  }
  function card(title,hint){
    const c=document.createElement('div'); c.className='scard';
    c.innerHTML='<h3>'+esc(title)+'</h3><p class="hint">'+hint+'</p>';
    return c;
  }
  function note(title,hint){ return card(title,hint); }
  function field(label,el,small){
    const w=document.createElement('div'); w.className='sfield'+(small?' sm':'');
    const l=document.createElement('label'); l.textContent=label;
    w.appendChild(l); w.appendChild(el); return w;
  }
  function input(value,ph,type){
    const i=document.createElement('input'); i.type=type||'text';
    i.value=value==null?'':value; if(ph)i.placeholder=ph; return i;
  }
  function btn(text,cls){
    const b=document.createElement('button'); b.className='dbtn'+(cls?' '+cls:'');
    b.textContent=text; return b;
  }
  function row(){ const r=document.createElement('div'); r.className='srow';
    [].slice.call(arguments).forEach(x=>r.appendChild(x)); return r; }
  function foot(){ const f=document.createElement('div'); f.className='sfoot';
    [].slice.call(arguments).forEach(x=>f.appendChild(x)); return f; }
  function kv(pairs){
    const g=document.createElement('div'); g.className='skv';
    pairs.forEach(([k,v])=>{
      const a=document.createElement('span'); a.className='k'; a.textContent=k;
      const b=document.createElement('span'); b.className='v';
      if(v instanceof Node) b.appendChild(v); else b.textContent=v==null?'—':String(v);
      g.appendChild(a); g.appendChild(b);
    });
    return g;
  }
  function badge(text,kind){
    const s=document.createElement('span'); s.className='badge'+(kind?' '+kind:'');
    s.textContent=text; return s;
  }
  function out(el,text){ el.className='out show'; el.textContent=text; }
  async function post(path,body){
    try{
      const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify(body||{})});
      return await r.json();
    }catch(e){ return {ok:false,error:String(e)}; }
  }
  function datalist(id,values){
    let dl=document.getElementById(id);
    if(dl) dl.remove();
    dl=document.createElement('datalist'); dl.id=id;
    values.forEach(v=>{ const o=document.createElement('option'); o.value=v;
      dl.appendChild(o); });
    return dl;
  }

  // ---- timezone: which calendar day "today" means -----------------------
  function tzCard(eff,env,ro){
    const c=card('Time zone',
      'Every date bucket — today, tomorrow, this week, overdue — is decided in '+
      'this zone. Leave it empty to follow the machine. Saved for the CLI and any '+
      'cron reading the same brain, not just this page.');
    const i=input(PREFS.settings.tz||'', 'system default ('+(eff.system_tz||'')+')');
    i.setAttribute('list','tzlist');
    if(ZONES.length) c.appendChild(datalist('tzlist',ZONES));
    c.appendChild(row(field('IANA name (e.g. America/Sao_Paulo)',i)));
    c.appendChild(kv([
      ['in effect', (eff.tz||eff.system_tz||'—')+'  ('+(eff.tz_source||'system')+')'],
      ['local time now', eff.now||'—'],
    ]));
    if(env.tz) c.appendChild(warn('<code>$SECOND_BRAIN_TZ='+esc(env.tz)+'</code> is set '+
      'in this server\'s environment and overrides whatever you save here.'));
    const save=btn('Save','pri'); save.disabled=ro;
    const res=document.createElement('div'); res.className='out';
    save.onclick=async()=>{
      save.disabled=true;
      const d=await post('/api/settings',{tz:i.value.trim()});
      save.disabled=false;
      if(!d.ok){ out(res,d.error||'failed'); return; }
      PREFS=d; render();
    };
    c.appendChild(foot(save));
    c.appendChild(res);
    return c;
  }
  function warn(html){
    const w=document.createElement('div'); w.className='warn'; w.innerHTML=html;
    return w;
  }

  // ---- defaults + interface --------------------------------------------
  function prefCard(eff,env,ro){
    const c=card('Defaults & interface',
      'The realm new nodes are filed under when nothing says otherwise, and how '+
      'often each tab re-reads the brain.');
    const rl=input(PREFS.settings.realm||'', eff.realm||'optibus');
    rl.setAttribute('list','realmlist');
    c.appendChild(datalist('realmlist',Object.keys(REALMS).sort()));
    const mp=input(PREFS.settings.map_poll_seconds||'', String(eff.map_poll_seconds||2),'number');
    const dr=input(PREFS.settings.dash_refresh_seconds||'', String(eff.dash_refresh_seconds||120),'number');
    mp.min=1; mp.max=600; dr.min=5; dr.max=3600;
    c.appendChild(row(field('default realm',rl),
                      field('map poll (s)',mp,true),
                      field('dash refresh (s)',dr,true)));
    if(env.realm) c.appendChild(warn('<code>$SECOND_BRAIN_REALM='+esc(env.realm)+
      '</code> overrides the default realm.'));
    const save=btn('Save','pri'); save.disabled=ro;
    const res=document.createElement('div'); res.className='out';
    save.onclick=async()=>{
      save.disabled=true;
      const d=await post('/api/settings',{realm:rl.value.trim().toLowerCase(),
        map_poll_seconds:mp.value, dash_refresh_seconds:dr.value});
      save.disabled=false;
      if(!d.ok){ out(res,d.error||'failed'); return; }
      PREFS=d;
      const e=d.effective||{};
      startPolling((e.map_poll_seconds||2)*1000);
      Dash.setRefresh((e.dash_refresh_seconds||120)*1000);
      render();
    };
    c.appendChild(foot(save));
    c.appendChild(res);
    return c;
  }

  // ---- the store: local mirror + neo4j master --------------------------
  function dbCard(ro){
    const c=card('Database connection',
      'The local SQLite file is always the durable mirror. Point this at a neo4j '+
      'master and the map, the dashboard and every write use it, falling back to '+
      'the mirror whenever it is unreachable.');
    if(!STATUS){
      c.appendChild(warn('This server does not serve <code>/api/status</code> — '+
        'restart <code>viz/serve.py</code>.'));
      return c;
    }
    const n=STATUS.neo4j||{};
    c.appendChild(kv([
      ['brain file', STATUS.db],
      ['home', STATUS.home],
      ['contents', STATUS.nodes+' nodes · '+STATUS.edges+' edges'],
      ['reading from', n.reading_from||'sqlite (local mirror)'],
      ['master', n.configured
        ? badge(n.up?'reachable':'unreachable', n.up?'ok':'bad')
        : badge('not configured')],
      ['queued writes', STATUS.pending_ops],
    ]));
    const url=input(n.url||'', 'http://neo4j-host:7474');
    const db=input(n.db||'', 'neo4j');
    const user=input(n.user||'', 'neo4j');
    const pw=input('', n.password_set?'unchanged':'password','password');
    c.appendChild(row(field('neo4j HTTP url',url)));
    c.appendChild(row(field('database',db,true),field('user',user,true),
                      field('password',pw)));
    if((n.env||[]).length) c.appendChild(warn('Set in this server\'s environment '+
      'and overriding the file: <code>'+esc(n.env.join(', '))+'</code>.'));
    const res=document.createElement('div'); res.className='out';
    const save=btn('Save connection','pri'); save.disabled=ro;
    const test=btn('Test');
    const flush=btn('Flush queued'+(STATUS.pending_ops?' ('+STATUS.pending_ops+')':''));
    flush.disabled=ro||!STATUS.pending_ops;
    save.onclick=async()=>{
      save.disabled=true;
      const d=await post('/api/neo4j-config',{url:url.value.trim(),db:db.value.trim(),
        user:user.value.trim(),password:pw.value});
      save.disabled=false;
      if(!d.ok){ out(res,d.error||'failed'); return; }
      out(res, d.cleared ? 'neo4j config removed — reading the local mirror only.'
        : (d.reachable ? 'saved · connection works.'
                       : 'saved · but the master did not answer: '+(d.error||'unreachable')));
      pw.value=''; show();
    };
    test.onclick=async()=>{
      test.disabled=true; out(res,'testing…');
      const d=await post('/api/neo4j-test',{});
      test.disabled=false;
      out(res, !d.ok ? (d.error||'failed')
        : d.reachable ? 'reachable: '+d.url
                      : 'no answer from '+d.url+' — '+(d.error||'unreachable'));
    };
    flush.onclick=async()=>{
      flush.disabled=true; out(res,'flushing…');
      const d=await post('/api/flush',{});
      out(res, JSON.stringify(d,null,2));
      show();
    };
    c.appendChild(foot(save,test,flush));
    c.appendChild(res);
    return c;
  }

  // ---- upkeep ----------------------------------------------------------
  function maintCard(ro){
    const c=card('Maintenance · prune',
      'Consolidates old captures into one digest per day so reads stay small as '+
      'the brain grows. <b>Nothing is deleted</b> — the originals stay searchable '+
      'and linked; what shrinks is how much a recall has to read. Safe to run '+
      'twice, safe to schedule.');
    if(STATUS) c.appendChild(kv([
      ['loose captures', STATUS.loose_captures+' not behind a digest yet'],
    ]));
    const keep=input(2,'2','number'); keep.min=0; keep.max=365;
    c.appendChild(row(field('keep last N days loose',keep,true)));
    const run=btn('Run prune','pri'); run.disabled=ro;
    const res=document.createElement('div'); res.className='out';
    run.onclick=async()=>{
      run.disabled=true; out(res,'pruning… (this can take a moment)');
      const d=await post('/api/prune',{keep_days:keep.value});
      run.disabled=ro;
      if(!d.ok){ out(res,d.error||'failed'); return; }
      out(res, ['days consolidated: '+(d.days_consolidated!=null?d.days_consolidated:'—'),
        'newly consolidated: '+(d.newly_consolidated!=null?d.newly_consolidated:'—'),
        'still loose: '+(d.still_loose!=null?d.still_loose:'—'),
        'read reduction: '+(d.read_reduction||'n/a'),
        'reversed edges repaired: '+(d.reversed_edges_repaired!=null?d.reversed_edges_repaired:'—'),
        '', JSON.stringify(d,null,2)].join('\n'));
      show();
    };
    c.appendChild(foot(run));
    c.appendChild(res);
    return c;
  }
  return { show, prefs };
})();

// ---- go ----
let POLL=2000, pollTimer=null;
function startPolling(ms){
  POLL=Math.max(1000, ms||POLL);
  clearInterval(pollTimer); pollTimer=setInterval(load, POLL);
}
load(); viewSummary(); startPolling(2000); requestAnimationFrame(draw);
// the poll cadences are settings, so ask for them once at boot
Settings.prefs().then(p=>{
  if(p.map_poll_seconds) startPolling(p.map_poll_seconds*1000);
  if(p.dash_refresh_seconds) Dash.setRefresh(p.dash_refresh_seconds*1000);
});
setMode(location.hash.slice(1)||'map');
</script>
